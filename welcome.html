<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <style>
      body {
        margin: 0;
        background: #070b14;
        color: white;
        font-family: Arial, sans-serif;
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(540px, 100%);
        background: #101827;
        border: 1px solid #243244;
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 24px;
        color: #a9b8ce;
      }

      .logout-button {
        background: #2563eb;
        border: none;
        color: white;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
      }

      .logout-button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>Welcome</h1>
        <p>You are logged in and ready to use your workspace.</p>

        <form action="/logout" method="POST">
          <button class="logout-button" type="submit">Log out</button>
        </form>
      </div>
    </div>
  </body>
</html>
