<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <link rel="stylesheet" href="/ai-motion.css" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #070b14;
      color: #eef6ff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(480px, 88vw);
      padding: 36px;
      text-align: center;
      background: #111827;
      border: 1px solid #243244;
      border-radius: 20px;
    }
    a, button {
      display: inline-block;
      margin: 12px 6px 0;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    button { background: #333; }
  </style>
</head>
<body>
  <main class="welcome-card">
    <h1 id="greeting">Welcome!</h1>
    <p>You’re logged in. Your workspace is ready.</p>
    <a href="/dashboard">Go to Dashboard</a>
    <form action="/logout" method="POST">
      <button type="submit">Log out</button>
    </form>
  </main>

  <script>
    fetch("/api/me")
      .then((response) => {
        if (!response.ok) throw new Error("Could not load your account.");
        return response.json();
      })
      .then((user) => {
        document.getElementById("greeting").textContent =
          `Welcome, ${user.name}!`;
      })
      .catch(() => {
        window.location.replace("/");
      });
  </script>
</body>
</html>
